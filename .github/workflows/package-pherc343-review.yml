name: Package private research review files

on:
  workflow_dispatch:
    inputs:
      packet:
        description: Private review packet to package (no inference)
        type: choice
        required: true
        default: pherc343-original
        options:
          - pherc343-original
          - pherc0800-support

permissions:
  contents: read

concurrency:
  group: package-pherc343-review
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'jl-drx/Herculaneum' && github.event.repository.private == true && inputs.packet != 'pherc0800-support'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out packaging code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/package_pherc343_review.py

      - name: Check out the pinned manifest and three LFS pointers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f85c6ab579da054d3ca94c3b7e4b58699f7c6a3a
          path: snapshot
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/workspace/MANIFEST.json
            /research/workspace/bundles/pherc343-results-001.tar.gz
            /research/workspace/bundles/pherc343-reference-001.tar.gz
            /research/workspace/bundles/pherc343-inputs-004.tar.gz

      - name: Fetch and verify only the three required LFS objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/package_pherc343_review.py fetch --snapshot snapshot

      - name: Package original archives, valid.npy and checksums
        run: python3 control/.github/scripts/package_pherc343_review.py package --snapshot snapshot --output artifact

      - name: Upload private review artifact for one day
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pherc343-review-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Write download and verification instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            printf 'Download: %s\n\n' "$ARTIFACT_URL"
            printf 'Artifact archive SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'After extracting the artifact ZIP, run `sha256sum -c SHA256SUMS`.\n\n'
            printf 'Retention: one day. Repository access is required. No inference was run.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  support-review:
    if: github.repository == 'jl-drx/Herculaneum' && github.event.repository.private == true && inputs.packet == 'pherc0800-support'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out compact geometry packet and packaging code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/package_support_review.py
            /research/handoffs/pherc0800-support-20261010/

      - name: Verify every source and package checksums and instructions
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/package_support_review.py \
            --source research/handoffs/pherc0800-support-20261010 \
            --output artifact --commit "$WORKFLOW_COMMIT"
          cd artifact
          sha256sum -c SHA256SUMS
          python3 verify_packet.py

      - name: Upload private CPU geometry task for one day
        id: support-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pherc0800-support-review-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: false

      - name: Write VM handoff instructions
        env:
          ARTIFACT_URL: ${{ steps.support-upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.support-upload.outputs.artifact-digest }}
        run: |
          {
            printf 'Download private VM task: %s\n\n' "$ARTIFACT_URL"
            printf 'Artifact archive SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'Unzip, run `sha256sum -c SHA256SUMS`, then `python3 verify_packet.py`.\n\n'
            printf 'Read `START_HERE.md` for the independent CPU geometry assignment.\n\n'
            printf 'Retention: one day. No CT intensity, model, LFS fetch or inference.\n'
          } >> "$GITHUB_STEP_SUMMARY"
