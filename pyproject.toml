[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herculaneum-research"
version = "0.1.0"
description = "Bounded scan acquisition and reproducible Herculaneum research artifacts"
requires-python = ">=3.12,<3.13"
dependencies = ["requests==2.34.2"]

[project.optional-dependencies]
r2 = ["botocore==1.43.106"]

[project.scripts]
herculaneum = "herculaneum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
